<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - StudyMate AI</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/premium-effects.css">
    <script src="/js/auth-guard.js"></script>
</head>
<body>
    <canvas id="bg-canvas"></canvas>
    <div class="vignette"></div>

    <div class="app-layout">
        <aside class="sidebar sidebar-premium" id="sidebar">
            <div class="sidebar-logo">
                <div class="logo-brain-icon"><span style="font-size: 1.2rem;">🧠</span></div>
                <span class="logo-text">StudyMate <span class="logo-ai-gradient">AI</span></span>
            </div>
            <ul class="nav-links">
                <li><a href="/dashboard.html"><span class="nav-icon">📊</span>Dashboard</a></li>
                <li><a href="/chat.html"><span class="nav-icon">💬</span>AI Chat</a></li>
                <li><a href="/notes.html"><span class="nav-icon">📝</span>Notes</a></li>
                <li><a href="/quiz.html"><span class="nav-icon">❓</span>Quiz</a></li>
                <li><a href="/flashcards.html"><span class="nav-icon">🃏</span>Flashcards</a></li>
                <li><a href="/analytics.html"><span class="nav-icon">📈</span>Analytics</a></li>
                <li><a href="/settings.html" class="active"><span class="nav-icon">⚙️</span>Settings</a></li>
            </ul>
            <div class="sidebar-user">
                <div class="user-name" id="sidebarUserName">👤 Student</div>
                <button class="btn btn-ghost btn-sm w-full" onclick="logout()">🚪 Logout</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="page-header">
                <h2>⚙️ Settings & Preferences</h2>
                <p>Customize your AI study companion experience</p>
            </div>

            <div class="card" style="max-width: 650px; margin: 0 auto;">
                <h3 style="color: #fff; margin-bottom: 20px;">AI Companion Persona</h3>
                <form id="settingsForm" onsubmit="saveSettings(event)">
                    <div class="form-group">
                        <label>Preferred Persona</label>
                        <select id="persona">
                            <option value="friendly_buddy">😊 Friendly Buddy (Alex)</option>
                            <option value="strict_teacher">📚 Strict Teacher (Professor Chen)</option>
                            <option value="motivational_mentor">🔥 Motivational Mentor (Coach Maya)</option>
                            <option value="exam_coach">🎯 Exam Coach (Dr. Patel)</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Study Goals</label>
                        <textarea id="study_goals" rows="3" placeholder="E.g., Master Data Structures, Ace AP Chemistry, prepare for SAT..."></textarea>
                    </div>

                    <h3 style="color: #fff; margin: 30px 0 20px;">Notification Preferences</h3>

                    <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                        <span>In-App Notifications</span>
                        <input type="checkbox" id="notification_enabled" checked style="width: auto;">
                    </div>

                    <div class="form-group" style="display: flex; justify-content: space-between; align-items: center;">
                        <span>Sound Effects</span>
                        <input type="checkbox" id="sound_enabled" checked style="width: auto;">
                    </div>

                    <button type="submit" class="btn btn-primary btn-lg w-full" style="margin-top: 24px;">
                        Save Preferences
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/js/premium-background.js"></script>
    <script src="/js/api.js"></script>
    <script>
        if (!requireAuth()) throw new Error('auth');
        initSidebar('/settings.html');

        document.addEventListener('DOMContentLoaded', loadSettings);

        async function loadSettings() {
            try {
                const data = await api.get('/api/settings');
                document.getElementById('persona').value = data.persona || 'friendly_buddy';
                document.getElementById('study_goals').value = data.study_goals || '';
            } catch (err) {
                console.error(err);
            }
        }

        async function saveSettings(e) {
            e.preventDefault();
            const persona = document.getElementById('persona').value;
            const study_goals = document.getElementById('study_goals').value;
            try {
                await api.put('/api/settings', { persona, study_goals });
                showToast('Settings saved successfully!', 'success');
            } catch (err) {
                showToast(err.message || 'Failed to save settings', 'error');
            }
        }
    </script>
</body>
</html>
