<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat - StudyMate AI</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/premium-effects.css">
    <script src="/js/auth-guard.js"></script>
</head>
<body>
    <!-- Three.js Background -->
    <canvas id="bg-canvas"></canvas>
    <div class="vignette"></div>
    
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar sidebar-premium" id="sidebar">
            <div class="sidebar-logo">
                <div class="logo-brain-icon">
                    <span style="font-size: 1.2rem;">🧠</span>
                </div>
                <span class="logo-text">StudyMate <span class="logo-ai-gradient">AI</span></span>
            </div>
            <ul class="nav-links">
                <li><a href="/dashboard.html"><span class="nav-icon">📊</span>Dashboard</a></li>
                <li><a href="/chat.html" class="active"><span class="nav-icon">💬</span>AI Chat</a></li>
                <li><a href="/notes.html"><span class="nav-icon">📝</span>Notes</a></li>
                <li><a href="/quiz.html"><span class="nav-icon">❓</span>Quiz</a></li>
                <li><a href="/flashcards.html"><span class="nav-icon">🃏</span>Flashcards</a></li>
                <li><a href="/analytics.html"><span class="nav-icon">📈</span>Analytics</a></li>
                <li><a href="/settings.html"><span class="nav-icon">⚙️</span>Settings</a></li>
            </ul>
            <div class="sidebar-user">
                <div class="user-name" id="sidebarUserName">👤 Student</div>
                <button class="btn btn-ghost btn-sm w-full" onclick="logout()">🚪 Logout</button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="main-content">
            <div class="chat-layout">
                <!-- Sessions Panel -->
                <div class="sessions-panel" id="sessionsPanel">
                    <div class="sessions-header">
                        <button class="btn btn-primary btn-sm" onclick="createNewSession()">+ New Chat</button>
                    </div>
                    <div class="session-list" id="sessionList">
                        <!-- Sessions will be loaded here -->
                    </div>
                </div>

                <!-- Chat Area -->
                <div class="chat-area">
                    <!-- Chat Header -->
                    <div class="chat-topbar">
                        <div>
                            <h3 id="chatTitle">New Chat</h3>
                            <div class="persona-pills" id="personaPills">
                                <button class="persona-pill active" data-persona="friendly_buddy">😊 Buddy</button>
                                <button class="persona-pill" data-persona="strict_teacher">📚 Teacher</button>
                                <button class="persona-pill" data-persona="motivational_mentor">🔥 Mentor</button>
                                <button class="persona-pill" data-persona="exam_coach">🎯 Coach</button>
                            </div>
                        </div>
                        <div class="header-right-actions">
                            <button class="header-icon-btn" onclick="toggleSessions()" title="Toggle Sessions">☰</button>
                        </div>
                    </div>

                    <!-- Messages -->
                    <div class="chat-messages" id="chatMessages" style="background: rgba(255,255,255,0.03);">
                        <div class="empty-state">
                            <div class="es-icon">💬</div>
                            <h3>Start a Conversation</h3>
                            <p>Ask me anything about your studies, or just chat!</p>
                        </div>
                    </div>

                    <!-- Quick Prompts -->
                    <div class="quick-prompts" id="quickPrompts">
                        <button class="quick-chip" onclick="sendQuickPrompt('Explain quantum physics')">🔬 Quantum Physics</button>
                        <button class="quick-chip" onclick="sendQuickPrompt('Help me with calculus')">📐 Calculus</button>
                        <button class="quick-chip" onclick="sendQuickPrompt('Review my essay')">📝 Essay Review</button>
                        <button class="quick-chip" onclick="sendQuickPrompt('Generate quiz questions')">❓ Quiz Me</button>
                        <button class="quick-chip" onclick="sendQuickPrompt('Create flashcards')">🃏 Flashcards</button>
                    </div>

                    <!-- Input Area -->
                    <div class="chat-input-wrap">
                        <div class="input-row">
                            <textarea 
                                id="prompt" 
                                placeholder="Ask anything about your studies..." 
                                rows="1"
                                onkeydown="handleKeyDown(event)"
                            ></textarea>
                            <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">
                                ➤ Send
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Mobile Menu Button -->
    <button class="mobile-btn" onclick="toggleMobileSidebar()">☰</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/js/premium-background.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/chat.js"></script>
    <script>
        // Initialize chat on page load
        document.addEventListener('DOMContentLoaded', () => {
            requireAuth();
            initSidebar('/chat.html');
            loadSessions();
            setupPersonaPills();
            autoResizeTextarea();
        });

        function autoResizeTextarea() {
            const textarea = document.getElementById('prompt');
            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 200) + 'px';
            });
        }

        function setupPersonaPills() {
            const pills = document.querySelectorAll('.persona-pill');
            pills.forEach(pill => {
                pill.addEventListener('click', async () => {
                    const persona = pill.dataset.persona;
                    await api.put('/api/settings', { persona });
                    pills.forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');
                    showToast(`Switched to ${pill.textContent.trim()}`, 'success');
                });
            });
        }

        function toggleSessions() {
            const panel = document.getElementById('sessionsPanel');
            panel.classList.toggle('open');
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('open');
        }
    </script>
</body>
</html>
