<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StudyMate AI</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/premium-effects.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
    <canvas id="bg-canvas"></canvas>
    <div class="vignette"></div>

    <div class="auth-container">
        <div class="glass-card auth-card">
            <div class="auth-logo">
                <div class="logo-brain-icon"><span style="font-size: 1.5rem;">🧠</span></div>
                <h2>StudyMate <span class="logo-ai-gradient">AI</span></h2>
            </div>
            
            <p class="auth-subtitle">Welcome back! Sign in to continue learning.</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="you@example.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-full" id="loginBtn">
                    Sign In →
                </button>
            </form>

            <div class="auth-footer">
                Don't have an account? <a href="/register.html">Create Account</a>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="/js/premium-background.js"></script>
    <script src="/js/api.js"></script>
    <script>
        // Redirect if already logged in
        if (api.getToken()) {
            window.location.href = '/dashboard.html';
        }

        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showToast('Please fill in all fields', 'error');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = 'Signing in...';

            try {
                const res = await api.post('/api/auth/login', { email, password });
                api.setToken(res.token);
                api.setUser(res.user);
                showToast('Welcome back!', 'success');
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 500);
            } catch (err) {
                showToast(err.message || 'Login failed', 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Sign In →';
            }
        }
    </script>
</body>
</html>
