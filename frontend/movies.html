<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaPass - Movie Catalog & Advanced Filtering</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #151c2c;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #232d42;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }

        header {
            background-color: rgba(21, 28, 44, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 16px 32px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo { font-size: 24px; font-weight: 800; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .logo i { color: var(--accent); }

        nav { display: flex; gap: 20px; }
        nav a { color: var(--text-muted); text-decoration: none; font-weight: 500; transition: 0.2s; }
        nav a:hover, nav a.active { color: #fff; }

        .container { max-width: 1300px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: 280px 1fr; gap: 30px; flex: 1; }

        /* Sidebar Filters */
        .sidebar { background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 24px; height: fit-content; }
        .sidebar h3 { font-size: 18px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
        .clear-btn { font-size: 12px; color: var(--accent); cursor: pointer; text-decoration: underline; border: none; background: none; }

        .filter-group { margin-bottom: 24px; }
        .filter-group label.title { font-weight: 600; font-size: 14px; color: #cbd5e1; margin-bottom: 12px; display: block; }
        .checkbox-list { display: flex; flex-direction: column; gap: 10px; max-height: 200px; overflow-y: auto; }
        .checkbox-item { display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: var(--text-muted); cursor: pointer; }
        .checkbox-item input { accent-color: var(--accent); width: 16px; height: 16px; margin-right: 8px; }
        .facet-count { background: #232d42; padding: 2px 8px; border-radius: 999px; font-size: 11px; color: #cbd5e1; }

        /* Main Content */
        .controls { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
        .search-box { position: relative; flex: 1; max-width: 400px; }
        .search-box input { width: 100%; background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px 12px 40px; color: #fff; outline: none; }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }

        .sort-box select { background: var(--card-bg); border: 1px solid var(--border); color: #fff; padding: 12px 16px; border-radius: 10px; outline: none; }

        /* Movies Grid */
        .movies-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; }
        .movie-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; transition: transform 0.3s, box-shadow 0.3s; text-decoration: none; color: inherit; display: flex; flex-direction: column; }
        .movie-card:hover { transform: translateY(-6px); box-shadow: 0 12px 24px rgba(99, 102, 241, 0.2); border-color: var(--accent); }

        .poster-wrapper { position: relative; width: 100%; height: 300px; background: #1e293b; overflow: hidden; }
        .poster-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        .rating-badge { position: absolute; top: 12px; right: 12px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); padding: 4px 10px; border-radius: 999px; font-weight: 700; font-size: 13px; color: #f59e0b; display: flex; align-items: center; gap: 4px; }

        .movie-info { padding: 16px; display: flex; flex-direction: column; flex: 1; }
        .movie-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; color: #fff; line-height: 1.3; }
        .movie-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
        .genre-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
        .genre-tag { background: rgba(99, 102, 241, 0.15); color: #a5b4fc; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; }

        /* Pagination */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 40px; }
        .page-btn { background: var(--card-bg); border: 1px solid var(--border); color: #fff; padding: 8px 16px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-btn:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }
    </style>
</head>
<body>

    <header>
        <a href="/movies.html" class="logo"><i class="fa-solid fa-film"></i> CinemaPass</a>
        <nav>
            <a href="/movies.html" class="active"><i class="fa-solid fa-clapperboard"></i> Movies</a>
            <a href="/admin-dashboard.html"><i class="fa-solid fa-chart-line"></i> Admin Dashboard</a>
            <a href="/login.html" id="userAuthLink" style="color: var(--accent); font-weight: 700;"><i class="fa-solid fa-user-circle"></i> Sign In / OTP Register</a>
        </nav>
    </header>

    <div class="container">
        <!-- Sidebar Multi-Select Filters -->
        <div class="sidebar">
            <h3>Filters <button class="clear-btn" onclick="clearFilters()">Reset All</button></h3>

            <div class="filter-group">
                <label class="title">Genres (Multi-Select)</label>
                <div class="checkbox-list" id="genreFilterList">
                    <!-- Populated dynamically with dynamic facet counts -->
                </div>
            </div>

            <div class="filter-group">
                <label class="title">Languages (Multi-Select)</label>
                <div class="checkbox-list" id="langFilterList">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>

        <!-- Main Movie Section -->
        <div>
            <div class="controls">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search movies by title or keyword..." oninput="debounceSearch()">
                </div>
                <div class="sort-box">
                    <select id="sortSelect" onchange="fetchMovies(1)">
                        <option value="release_date:desc">Newest Releases</option>
                        <option value="rating:desc">Highest Rated</option>
                        <option value="popularity:desc">Most Popular</option>
                        <option value="title:asc">Title (A-Z)</option>
                    </select>
                </div>
            </div>

            <div class="movies-grid" id="moviesGrid">
                <!-- Movie cards injected dynamically -->
            </div>

            <div class="pagination">
                <button class="page-btn" id="prevBtn" onclick="changePage(-1)"><i class="fa-solid fa-chevron-left"></i> Prev</button>
                <span id="pageInfo" style="font-size: 14px; color: var(--text-muted);">Page 1 of 1</span>
                <button class="page-btn" id="nextBtn" onclick="changePage(1)">Next <i class="fa-solid fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <script>
        let currentPage = 1;
        let totalPages = 1;
        let searchTimeout = null;

        const allGenres = ["Action", "Comedy", "Drama", "Sci-Fi", "Thriller", "Romance", "Horror", "Animation"];
        const allLanguages = ["English", "Hindi", "Telugu", "Tamil", "Spanish"];

        async function fetchMovies(page = 1) {
            currentPage = page;
            const selectedGenres = Array.from(document.querySelectorAll('.genre-cb:checked')).map(cb => cb.value);
            const selectedLangs = Array.from(document.querySelectorAll('.lang-cb:checked')).map(cb => cb.value);
            const searchQuery = document.getElementById('searchInput').value.trim();
            const [sortBy, sortOrder] = document.getElementById('sortSelect').value.split(':');

            let url = `/api/movies?page=${page}&limit=8&sort_by=${sortBy}&sort_order=${sortOrder}`;
            if (selectedGenres.length) url += `&genres=${encodeURIComponent(selectedGenres.join(','))}`;
            if (selectedLangs.length) url += `&languages=${encodeURIComponent(selectedLangs.join(','))}`;
            if (searchQuery) url += `&search=${encodeURIComponent(searchQuery)}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                renderMovies(data.items);
                renderFacets(data.facet_counts, selectedGenres, selectedLangs);
                updatePagination(data.page, data.total_pages, data.total);
            } catch (err) {
                console.error("Failed to load movies:", err);
            }
        }

        function renderMovies(movies) {
            const grid = document.getElementById('moviesGrid');
            if (!movies || movies.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-muted);">
                    <i class="fa-solid fa-film" style="font-size: 48px; margin-bottom: 16px; opacity: 0.5;"></i>
                    <p>No movies match the selected filters.</p>
                </div>`;
                return;
            }

            grid.innerHTML = movies.map(m => `
                <a href="/movie-detail.html?id=${m.id}" class="movie-card">
                    <div class="poster-wrapper">
                        <img src="${m.poster_url || 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?w=500'}" alt="${m.title}" loading="lazy">
                        <div class="rating-badge"><i class="fa-solid fa-star"></i> ${m.rating}</div>
                    </div>
                    <div class="movie-info">
                        <div class="movie-title">${m.title}</div>
                        <div class="movie-meta">${m.language} • ${m.duration_minutes} mins</div>
                        <div class="genre-tags">
                            ${m.genres.map(g => `<span class="genre-tag">${g}</span>`).join('')}
                        </div>
                    </div>
                </a>
            `).join('');
        }

        function renderFacets(facets, selectedGenres, selectedLangs) {
            const gContainer = document.getElementById('genreFilterList');
            const gCounts = facets.genres || {};
            gContainer.innerHTML = allGenres.map(g => {
                const isChecked = selectedGenres.includes(g) ? 'checked' : '';
                const count = gCounts[g] || 0;
                return `<label class="checkbox-item">
                    <span><input type="checkbox" class="genre-cb" value="${g}" ${isChecked} onchange="fetchMovies(1)"> ${g}</span>
                    <span class="facet-count">${count}</span>
                </label>`;
            }).join('');

            const lContainer = document.getElementById('langFilterList');
            const lCounts = facets.languages || {};
            lContainer.innerHTML = allLanguages.map(l => {
                const isChecked = selectedLangs.includes(l) ? 'checked' : '';
                const count = lCounts[l] || 0;
                return `<label class="checkbox-item">
                    <span><input type="checkbox" class="lang-cb" value="${l}" ${isChecked} onchange="fetchMovies(1)"> ${l}</span>
                    <span class="facet-count">${count}</span>
                </label>`;
            }).join('');
        }

        function updatePagination(page, totalP, totalCount) {
            currentPage = page;
            totalPages = totalP;
            document.getElementById('pageInfo').innerText = `Page ${page} of ${totalP || 1} (${totalCount} Movies)`;
            document.getElementById('prevBtn').disabled = (page <= 1);
            document.getElementById('nextBtn').disabled = (page >= totalP);
        }

        function changePage(delta) {
            const target = currentPage + delta;
            if (target >= 1 && target <= totalPages) {
                fetchMovies(target);
            }
        }

        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => fetchMovies(1), 300);
        }

        function clearFilters() {
            document.querySelectorAll('.genre-cb, .lang-cb').forEach(cb => cb.checked = false);
            document.getElementById('searchInput').value = '';
            fetchMovies(1);
        }

        window.onload = () => fetchMovies(1);
    </script>
</body>
</html>
